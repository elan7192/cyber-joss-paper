<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>賽博燒金紙</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="scanlines"></div>
<header>
  <h1 class="glitch" data-text="賽博燒金紙">賽博燒金紙</h1>
  <p class="sub">CYBER JOSS PAPER // 心誠則靈・數位供奉</p>
</header>
<main>
  <section class="furnace-wrap">
    <div id="furnace" class="furnace">
      <div class="roof">金 爐</div>
      <canvas id="fire"></canvas>
      <div class="mouth">拖曳或點擊紙錢投入</div>
    </div>
    <div class="stats">已焚化：<span id="count">0</span> 張</div>
    <div id="blessing" class="blessing">🙏 誠心祈願，萬事如意</div>
  </section>
  <section class="papers">
    <h2>選擇紙錢</h2>
    <div class="tray" id="tray">
      <div class="paper gold" data-type="金紙" data-label="金紙">金紙</div>
      <div class="paper silver" data-type="銀紙" data-label="銀紙">銀紙</div>
      <div class="paper rebirth" data-type="往生錢" data-label="往生錢">往生錢</div>
      <div class="paper custom" data-type="自訂" data-label="願望" id="customPaper">願望</div>
    </div>
    <div class="custom-row">
      <input id="customText" maxlength="8" placeholder="自訂文字（例：願望）">
      <button id="setCustom">寫上</button>
    </div>
    <button id="sound" class="toggle">🔇 音效：關</button>
  </section>
</main>
<footer>本頁僅供娛樂與心意表達，敬天惜福。</footer>
<script src="script.js"></script>
</body>
</html>
